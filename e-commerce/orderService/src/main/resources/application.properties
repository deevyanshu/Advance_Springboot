spring.application.name=orderService
spring.datasource.url=jdbc:mysql://localhost:3306/order_service
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=none
spring.server.port=8081

# External service (WebClient) configuration
# Base URL for external service; defaults to http://localhost:8082
external.service.base-url=http://localhost:8082
# Connection timeout (milliseconds)
external.service.connect-timeout-ms=5000
# Response / read/write timeout (milliseconds)
external.service.response-timeout-ms=10000

spring.datasource.kafka.bootstrap-servers=localhost:9092
spring.datasource.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.datasource.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.datasource.kafka.producer.acks=all
